<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #vid {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <video id="vid" autoplay muted loop="false" playsinline></video>

  <script>
    var totalCount = 6;
    var currentNum = 1;
    var baseUrl = "https://rikalamizard.github.io/videoloading/video";
    var vid = document.getElementById("vid");

    function playVideo(num) {
      currentNum = num;
      vid.src = baseUrl + num + ".mp4";
      vid.load();
      var playPromise = vid.play();
      if (playPromise !== undefined) {
        playPromise.catch(function () {
          // Autoplay diblokir atau gagal -> lanjut ke video berikutnya, jangan stuck
          nextVideo();
        });
      }
    }

    function nextVideo() {
      var num = currentNum + 1;
      if (num > totalCount) {
        num = 1;
      }
      playVideo(num);
    }

    vid.addEventListener("ended", nextVideo);
    // Kalau file error/404/corrupt -> skip, jangan berhenti total
    vid.addEventListener("error", nextVideo);

    playVideo(1);
  </script>
</body>
</html>
