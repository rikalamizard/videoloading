<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #vid {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <video id="vid" autoplay muted playsinline></video>

  <script>
    var totalCount = 6;
    var currentNum = 1;
    var baseUrl = "https://rikalamizard.github.io/videoloading/video";
    var vid = document.getElementById("vid");
    var switchTimer = null;
    var FALLBACK_MS = 15000; // kalau durasi video ga kebaca, paksa ganti setelah 15 detik

    function clearSwitchTimer() {
      if (switchTimer) {
        clearTimeout(switchTimer);
        switchTimer = null;
      }
    }

    function scheduleNext(ms) {
      clearSwitchTimer();
      switchTimer = setTimeout(nextVideo, ms);
    }

    function playVideo(num) {
      currentNum = num;
      clearSwitchTimer();

      vid.src = baseUrl + num + ".mp4";
      vid.load();

      var playPromise = vid.play();
      if (playPromise !== undefined) {
        playPromise.catch(function () {
          scheduleNext(1000);
        });
      }

      scheduleNext(FALLBACK_MS);
    }

    function nextVideo() {
      var num = currentNum + 1;
      if (num > totalCount) {
        num = 1;
      }
      playVideo(num);
    }

    vid.addEventListener("loadedmetadata", function () {
      if (vid.duration && isFinite(vid.duration) && vid.duration > 0) {
        scheduleNext((vid.duration * 1000) + 300);
      }
    });

    vid.addEventListener("ended", function () {
      nextVideo();
    });

    vid.addEventListener("error", function () {
      scheduleNext(500);
    });

    playVideo(1);
  </script>
</body>
</html>
